<!DOCTYPE html>
<html>
<head>
  <title>Sales history</title>
</head>
<body>
  <h1>Sales history</h1>
  <a href="/">Back to products</a>

  <table border="1">
    <tr><th>Date</th><th>Product</th><th>Quantity</th><th>Total</th><th>Action</th></tr>
    {% for s in sales %}
    <tr>
      <td>{{ s.date.strftime("%Y-%m-%d %H:%M") }}</td>
      <td>{{ s.product_name }}</td>
      <td>{{ s.quantity }}</td>
      <td>{{ s.total }}</td>
    <td>
  <form action="/sales/cancel/{{ s.id }}" method="POST">
    <button type="submit">Cancel sale</button>
  </form>
</td>
    </tr>
    {% endfor %}
  </table>

  <h3>Total sales: {{ total }}</h3>
</body>
</html>
